# Hourhand: types, lint, unit tests (with a real Postgres for the database tests), a production build,
# and the end-to-end scripts against that build (local fake Google, Microsoft, Razorpay, Stripe and CalDAV servers) on every PR.
name: Hourhand CI

on:
  pull_request:
    paths-ignore: ["docs/**"]
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  # "Run workflow" button in the Actions tab: checks and, on main, deploys without needing a new push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourhand-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit -p .
      - name: Lint
        run: npm run lint
      - name: Unit tests
        # The database tests create and drop their own databases named after this one.
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hourhand_test
        run: npm test
      - name: Build
        run: npm run build
      - name: End-to-end
        # Drops and recreates hourhand_e2e for each group; any FAIL, or a script that crashes, fails the step.
        env:
          E2E_PG: postgres://postgres:postgres@localhost:5432
        run: sh e2e/run-all.sh
      - name: Keep e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e/.out/
          retention-days: 7

  # Production deploy: only after `check` passes on a push to main. Coolify's own git auto-deploy
  # never fired (PR #8 needed a manual Redeploy), so CI triggers it through Coolify's API instead
  # and waits for the result, so a failed deploy turns this run red.
  # Needs two secrets in the GitHub Environment "Production": COOLIFY_WEBHOOK (the app's Deploy
  # Webhook URL, from its Webhooks tab in Coolify) and COOLIFY_TOKEN (a Coolify API token with
  # deploy permission). Environment secrets reach a job only when it names that environment.
  deploy:
    needs: check
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    environment:
      name: Production
      url: https://hourhand.cloud
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: hourhand-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy through Coolify
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::COOLIFY_WEBHOOK and COOLIFY_TOKEN must be set as secrets of the Production environment"; exit 1
          fi
          auth="Authorization: Bearer $COOLIFY_TOKEN"
          # Coolify 4.7+ only accepts POST on /api/v1/deploy; a GET returns "This endpoint has changed to a POST request."
          resp=$(curl -fsS --retry 3 --retry-all-errors -X POST -H "$auth" "$COOLIFY_WEBHOOK")
          echo "Coolify: $resp"
          id=$(echo "$resp" | jq -r '.deployments[0].deployment_uuid // empty')
          [ -n "$id" ] || { echo "::error::Coolify returned no deployment_uuid"; exit 1; }
          api="${COOLIFY_WEBHOOK%%/api/v1/*}/api/v1"
          for i in $(seq 1 120); do
            status=$(curl -fsS --retry 3 --retry-all-errors -H "$auth" "$api/deployments/$id" | jq -r '.status')
            echo "[$i] deployment $id: $status"
            case "$status" in
              finished) exit 0 ;;
              failed|cancelled*) echo "::error::Coolify deployment $id $status; see its log in Coolify"; exit 1 ;;
              queued|in_progress) ;;
              *) echo "::error::Unexpected deployment status '$status' from $api/deployments/$id"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Coolify deployment $id did not finish within 20 minutes"; exit 1
      - name: Check the live site
        run: |
          set -euo pipefail
          for p in / /coaches /sign-in /api/health; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-all-errors --retry-delay 5 "https://hourhand.cloud$p")
            echo "$p $code"; [ "$code" = 200 ] || { echo "::error::$p returned $code"; exit 1; }
          done
          curl -fsS https://hourhand.cloud/api/health
