# Hourhand: types, lint, unit tests (with a real Postgres for the database tests), a production build,
# and the end-to-end scripts against that build (local fake Google, Microsoft, Razorpay, Stripe and CalDAV servers) on every PR.
name: Hourhand CI

on:
  pull_request:
    paths-ignore: ["docs/**"]
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  # "Run workflow" button in the Actions tab: checks and, on main, deploys without needing a new push.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run's tests (i18n, check), but never a deploy that has
# started: the deploy job has its own queue below. A run-wide cancel here used to stop deploys half way, and with
# several merges a minute nothing on main ever finished.

jobs:
  # Every guest text catalog has every language (src/lib/i18n/catalogs.test.ts finds the catalogs on its own). Its own
  # job, fast and with no database, so "i18n catalogs" can be a required status check on main: a PR that adds a
  # language, or an English line, without the translations can't merge. The same tests also run inside `check`.
  i18n:
    name: i18n catalogs
    runs-on: ubuntu-latest
    concurrency:
      group: hourhand-i18n-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Every catalog has every language
        run: npm run test:i18n

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: hourhand-check-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit -p .
      - name: Lint
        run: npm run lint
      - name: Unit tests
        # The database tests create and drop their own databases named after this one.
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hourhand_test
        run: npm test
      - name: Build
        run: npm run build
      - name: End-to-end
        # Drops and recreates hourhand_e2e for each group; any FAIL, or a script that crashes, fails the step.
        env:
          E2E_PG: postgres://postgres:postgres@localhost:5432
        run: sh e2e/run-all.sh
      - name: Keep e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e/.out/
          retention-days: 7

  # Production deploy: only after `check` and `i18n` pass on a push to main. This is the only way code goes
  # live: Coolify's own git auto-deploy is off (it was found on and turned off on 2026-11-17, after it shipped
  # commits whose checks hadn't run). CI triggers Coolify through its API and waits for the result, so a failed
  # deploy turns this run red. Deploys queue one at a time (hourhand-deploy) and are never cancelled once
  # started; if several are waiting, only the newest runs.
  # Needs two secrets in the GitHub Environment "Production": COOLIFY_WEBHOOK (the app's Deploy
  # Webhook URL, from its Webhooks tab in Coolify) and COOLIFY_TOKEN (a Coolify API token with
  # deploy permission). Environment secrets reach a job only when it names that environment.
  deploy:
    needs: [check, i18n]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    environment:
      name: Production
      url: https://hourhand.cloud
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: hourhand-deploy
      cancel-in-progress: false
    steps:
      # Coolify's deploy webhook builds whatever main points to when it fetches, not a given commit. So deploy only
      # while main is still this run's commit: if it has moved on, the newer commit's own run deploys it after its
      # checks, and this one stops here instead of shipping code nobody has tested.
      - name: Main is still this run's commit
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          now=$(curl -fsS --retry 3 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/main" | jq -r '.sha')
          if [ "$now" = "${{ github.sha }}" ]; then echo "current=true" >> "$GITHUB_OUTPUT"
          else echo "current=false" >> "$GITHUB_OUTPUT"; echo "::notice::main is now $now, not ${{ github.sha }}; its own run deploys it."; fi
      - name: Deploy through Coolify
        if: steps.head.outputs.current == 'true'
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::COOLIFY_WEBHOOK and COOLIFY_TOKEN must be set as secrets of the Production environment"; exit 1
          fi
          auth="Authorization: Bearer $COOLIFY_TOKEN"
          # Coolify 4.7+ only accepts POST on /api/v1/deploy; a GET returns "This endpoint has changed to a POST request."
          resp=$(curl -fsS --retry 3 --retry-all-errors -X POST -H "$auth" "$COOLIFY_WEBHOOK")
          echo "Coolify: $resp"
          id=$(echo "$resp" | jq -r '.deployments[0].deployment_uuid // empty')
          [ -n "$id" ] || { echo "::error::Coolify returned no deployment_uuid"; exit 1; }
          api="${COOLIFY_WEBHOOK%%/api/v1/*}/api/v1"
          for i in $(seq 1 120); do
            status=$(curl -fsS --retry 3 --retry-all-errors -H "$auth" "$api/deployments/$id" | jq -r '.status')
            echo "[$i] deployment $id: $status"
            case "$status" in
              finished) exit 0 ;;
              failed|cancelled*) echo "::error::Coolify deployment $id $status; see its log in Coolify"; exit 1 ;;
              queued|in_progress) ;;
              *) echo "::error::Unexpected deployment status '$status' from $api/deployments/$id"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Coolify deployment $id did not finish within 20 minutes"; exit 1
      - name: Check the live site
        if: steps.head.outputs.current == 'true'
        run: |
          set -euo pipefail
          for p in / /coaches /sign-in /api/health; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-all-errors --retry-delay 5 "https://hourhand.cloud$p")
            echo "$p $code"; [ "$code" = 200 ] || { echo "::error::$p returned $code"; exit 1; }
          done
          # The live server must be exactly the commit this run checked (main can move between the check above and
          # Coolify's fetch; if it did, say so loudly rather than pass).
          live=$(curl -fsS https://hourhand.cloud/api/health | jq -r '.commit')
          echo "live commit: $live"
          [ "$live" = "${{ github.sha }}" ] || { echo "::error::Live commit is $live, not the checked ${{ github.sha }}: main moved during the deploy. The newer commit's own run will deploy it once its checks pass."; exit 1; }
